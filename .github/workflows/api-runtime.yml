name: API isolated runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - name: Install, upgrade, HTTP, ORM, concurrency, publish and restart
        env:
          FACODI_API_SOURCE: ${{ github.workspace }}/addons/facodi-api/facodi_api
          FACODI_LEARNING_FULL_TESTS: "1"
        run: bash tests/test_api_e2e_isolated.sh
