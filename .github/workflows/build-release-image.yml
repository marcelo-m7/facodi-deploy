name: Build FACODI release image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable image to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/facodi-odoo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Validate source before build
        run: |
          bash scripts/validate-repository.sh
          FACODI_IMAGE=ghcr.io/example/facodi-odoo:test \
            docker compose --env-file .env.ci -f deploy/coolify/docker-compose.prebuilt.yml config --quiet

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ inputs.publish }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Release reference
        run: |
          echo "FACODI_IMAGE=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Use the SHA tag only after this workflow succeeds." >> "$GITHUB_STEP_SUMMARY"
