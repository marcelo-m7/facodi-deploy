name: Terraform plan

on:
  pull_request:
    paths:
      - infrastructure/terraform/**
      - .github/workflows/terraform-plan.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: ${{ vars.TERRAFORM_PLAN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: shared
            path: infrastructure/terraform/shared
            prefix: shared
          - stack: staging
            path: infrastructure/terraform/environments/staging
            prefix: environments/staging
          - stack: production
            path: infrastructure/terraform/environments/production
            prefix: environments/production
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1

      - name: Initialize Terraform state
        run: >-
          terraform -chdir="${{ matrix.path }}" init -input=false
          -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}"
          -backend-config="prefix=${{ matrix.prefix }}"

      - name: Terraform plan
        shell: bash
        run: |
          set -o pipefail
          terraform -chdir="${{ matrix.path }}" plan -input=false -no-color | tee plan.txt
          {
            echo "### Terraform plan: ${{ matrix.stack }}"
            echo '```text'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
