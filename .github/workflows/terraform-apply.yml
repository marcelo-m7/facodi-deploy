name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Terraform stack to apply
        required: true
        type: choice
        options:
          - shared
          - staging
          - production

permissions:
  contents: read
  id-token: write

jobs:
  apply-non-production:
    if: ${{ inputs.stack != 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1

      - id: target
        shell: bash
        run: |
          case "${{ inputs.stack }}" in
            shared)
              echo "path=infrastructure/terraform/shared" >> "$GITHUB_OUTPUT"
              echo "prefix=shared" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "path=infrastructure/terraform/environments/staging" >> "$GITHUB_OUTPUT"
              echo "prefix=environments/staging" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 64 ;;
          esac

      - name: Initialize Terraform state
        run: >-
          terraform -chdir="${{ steps.target.outputs.path }}" init -input=false
          -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}"
          -backend-config="prefix=${{ steps.target.outputs.prefix }}"

      - name: Plan exact apply
        run: terraform -chdir="${{ steps.target.outputs.path }}" plan -input=false -out=tfplan

      - name: Apply saved plan
        run: terraform -chdir="${{ steps.target.outputs.path }}" apply -input=false -auto-approve tfplan

  apply-production:
    if: ${{ inputs.stack == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1

      - name: Initialize production Terraform state
        run: >-
          terraform -chdir=infrastructure/terraform/environments/production init -input=false
          -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}"
          -backend-config="prefix=environments/production"

      - name: Plan exact production apply
        run: terraform -chdir=infrastructure/terraform/environments/production plan -input=false -out=tfplan

      - name: Apply saved production plan
        run: terraform -chdir=infrastructure/terraform/environments/production apply -input=false -auto-approve tfplan
