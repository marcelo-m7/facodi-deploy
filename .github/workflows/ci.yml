name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  quick-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository contract
        run: bash scripts/validate-repository.sh

      - name: Validate Coolify Compose
        run: docker compose --env-file .env.ci -f deploy/coolify/docker-compose.yml config --quiet

      - name: Validate prebuilt-image Coolify candidate
        env:
          FACODI_IMAGE: ghcr.io/example/facodi-odoo:test
        run: docker compose --env-file .env.ci -f deploy/coolify/docker-compose.prebuilt.yml config --quiet

  validate-coolify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser acceptance runtime
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0

      - name: Locate runner Chrome or Chromium
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "FACODI_BROWSER_CHROME_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Chrome/Chromium binary found on the GitHub runner" >&2
          exit 1

      - name: Validate repository contract
        run: bash scripts/validate-repository.sh

      - name: Validate Coolify Compose
        run: docker compose --env-file .env.ci -f deploy/coolify/docker-compose.yml config --quiet

      - name: Exercise clean-install Odoo runtime and browser smoke tests
        env:
          FACODI_REQUIRE_EMPTY_DATABASE: "1"
          FACODI_BROWSER_ACCEPTANCE: "1"
          FACODI_BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/facodi-browser
          FACODI_D2_BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/facodi-d2-browser
        run: bash tests/test_coolify_runtime.sh

      - name: Upload D1 browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facodi-browser-acceptance
          path: ${{ runner.temp }}/facodi-browser
          if-no-files-found: warn
          retention-days: 7

      - name: Upload D2 browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facodi-d2-browser-acceptance
          path: ${{ runner.temp }}/facodi-d2-browser
          if-no-files-found: warn
          retention-days: 7


  prebuilt-image-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository contract
        run: bash scripts/validate-repository.sh

      - name: Build candidate image once
        run: docker build -f docker/Dockerfile -t facodi-prebuilt:${{ github.sha }} .

      - name: Exercise prebuilt-image migration/runtime
        env:
          FACODI_IMAGE: facodi-prebuilt:${{ github.sha }}
          FACODI_RUNTIME_COMPOSE_FILE: deploy/coolify/docker-compose.prebuilt.yml
          FACODI_RUNTIME_SKIP_BUILD: "1"
          FACODI_REQUIRE_EMPTY_DATABASE: "1"
        run: bash tests/test_coolify_runtime.sh

      - name: Prove failed migration does not promote Odoo
        env:
          FACODI_IMAGE: facodi-prebuilt:${{ github.sha }}
        run: bash tests/test_prebuilt_fail_closed.sh
