services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_64_POSTGRES
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: odoo
      DB_PASSWORD: $SERVICE_PASSWORD_64_POSTGRES
      ODOO_DB: facodi
      ODOO_ADMIN_PASSWD: $SERVICE_PASSWORD_64_ODOO_ADMIN
      FACODI_MODULES: facodi_learning,theme_facodi,facodi_ai,facodi_ai_website,monodoo_backend
      FACODI_WEBSITE_DOMAIN: ${FACODI_WEBSITE_DOMAIN:-facodi.com}
      FACODI_ALLOW_SINGLE_WEBSITE_BOOTSTRAP: ${FACODI_ALLOW_SINGLE_WEBSITE_BOOTSTRAP:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: "8069"
    volumes:
      - odoo-data:/var/lib/odoo

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: odoo
      DB_PASSWORD: $SERVICE_PASSWORD_64_POSTGRES
      ODOO_DB: facodi
      ODOO_ADMIN_PASSWD: $SERVICE_PASSWORD_64_ODOO_ADMIN
      FACODI_MODULES: facodi_learning,theme_facodi,facodi_ai,facodi_ai_website,monodoo_backend
      FACODI_WEBSITE_DOMAIN: ${FACODI_WEBSITE_DOMAIN:-facodi.com}
      FACODI_ALLOW_SINGLE_WEBSITE_BOOTSTRAP: ${FACODI_ALLOW_SINGLE_WEBSITE_BOOTSTRAP:-0}
      ODOO_WORKERS: ${ODOO_WORKERS:-2}
      ODOO_MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-1}
      ODOO_GEVENT_PORT: ${ODOO_GEVENT_PORT:-8072}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: "8069"
    volumes:
      - odoo-data:/var/lib/odoo
    expose:
      - "8069"
      - "8072"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:$${PORT}/web/login', timeout=5).close()\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  postgres-data:
  odoo-data:
