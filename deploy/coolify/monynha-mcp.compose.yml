# Separate Coolify Git-based Compose Application sourced from facodi-deploy.
# Configure Base Directory: / ; Docker Compose Location:
# deploy/coolify/monynha-mcp.compose.yml
# Do not attach these services to the FACODI Odoo Compose application.
services:
  monynha-db:
    image: postgres:17
    restart: unless-stopped
    networks: [monynha-private]
    environment:
      POSTGRES_DB: monynha_mcp
      POSTGRES_USER: monynha
      POSTGRES_PASSWORD: ${MONYNHA_MCP_DB_PASSWORD:?Set an isolated PostgreSQL password in Coolify}
    volumes:
      - monynha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U monynha -d monynha_mcp"]
      interval: 10s
      timeout: 5s
      retries: 10

  monynha-mcp:
    build:
      context: https://github.com/marcelo-m7/odoo-remote-mcp.git#a6c042bffa7d2275c26fc2d09e68d553616498a0
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      monynha-db:
        condition: service_healthy
    networks: [monynha-private, monynha-egress]
    command:
      - /bin/sh
      - -ec
      - |
        alembic upgrade head
        exec monynha-odoo-mcp
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MONYNHA_MCP_MODE: http
      MONYNHA_MCP_HTTP_HOST: 0.0.0.0
      MONYNHA_MCP_HTTP_PORT: "8000"
      MONYNHA_MCP_DATABASE_URL: ${MONYNHA_MCP_DATABASE_URL:?Set a private connection string in Coolify}
      MONYNHA_MCP_PUBLIC_URL: ${MONYNHA_MCP_PUBLIC_URL:?Set the HTTPS resource URL in Coolify}
      MONYNHA_MCP_OIDC_ISSUER: https://wvkjainfwsyiyfcmbtid.supabase.co/auth/v1
      MONYNHA_MCP_OIDC_JWKS_URL: https://wvkjainfwsyiyfcmbtid.supabase.co/auth/v1/.well-known/jwks.json
      MONYNHA_MCP_OIDC_AUDIENCE: ${MONYNHA_MCP_PUBLIC_URL:?Set the HTTPS resource URL in Coolify}
      MONYNHA_MCP_OAUTH_PROVIDER: supabase
      MONYNHA_MCP_OAUTH_ALLOWED_CLIENT_IDS: ${MONYNHA_MCP_OAUTH_ALLOWED_CLIENT_IDS:-[]}
      MONYNHA_MCP_WRITES_ENABLED: "false"
      MONYNHA_MCP_ALLOWED_ORIGINS: ${MONYNHA_MCP_ALLOWED_ORIGINS:-[]}
      MONYNHA_ODOO_KEY_DEFAULT: ${MONYNHA_ODOO_KEY_DEFAULT:-}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

networks:
  monynha-private:
    internal: true
  monynha-egress:

volumes:
  monynha-postgres-data:
