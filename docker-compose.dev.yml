services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-facodi-dev-postgres-password}
    volumes:
      - facodi-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: odoo
      DB_PASSWORD: ${ODOO_DB_PASSWORD:-facodi-dev-postgres-password}
      ODOO_DB: ${ODOO_DB:-facodi_dev}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:-facodi-dev-admin-password}
      ODOO_ADDONS_PATH: /opt/odoo/addons,/mnt/extra-addons/facodi-ai,/mnt/extra-addons/facodi-learning,/mnt/extra-addons/facodi-theme,/mnt/extra-addons/odoo-design-themes
      ODOO_DATA_DIR: /var/lib/odoo
      ODOO_HTTP_PORT: "8069"
      ODOO_WORKERS: "0"
      ODOO_MAX_CRON_THREADS: "0"
      ODOO_DEV_MODE: all
    ports:
      - 127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5).close()\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ${ODOO_SOURCE_PATH:-../Codoo/odoo/odoo}:/opt/odoo
      - ./addons/facodi-ai:/mnt/extra-addons/facodi-ai
      - ./addons/facodi-learning:/mnt/extra-addons/facodi-learning
      - ./addons/facodi-theme:/mnt/extra-addons/facodi-theme
      - ./vendor/odoo-design-themes:/mnt/extra-addons/odoo-design-themes
      - facodi-dev-odoo:/var/lib/odoo

volumes:
  facodi-dev-postgres:
  facodi-dev-odoo: